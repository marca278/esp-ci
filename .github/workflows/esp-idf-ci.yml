name: ESP-IDF CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CODECHECKER_MAX_CRITICAL: '0'
  CODECHECKER_MAX_HIGH: '0'
  CODECHECKER_MAX_MEDIUM: '0'
  CODECHECKER_MAX_LOW: '10'
  CODECHECKER_MAX_STYLE: '20'
  CODECHECKER_MAX_UNSPECIFIED: '0'

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

concurrency:
  group: esp-idf-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Allow Git workspace in container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install quality tools
        run: |
          apt-get update
          apt-get install -y cppcheck python3-venv

      - name: Set up CodeChecker
        run: |
          python3 -m venv .venv-codechecker
          . .venv-codechecker/bin/activate
          pip install --upgrade pip
          pip install codechecker

      - name: Generate compilation database
        run: |
          . /opt/esp/idf/export.sh
          idf.py -B build-checks set-target esp32
          idf.py -B build-checks reconfigure
          test -f build-checks/compile_commands.json

      # - name: Check formatting
      #   run: |
      #     mapfile -d '' source_files < <(git ls-files -z '*.c' '*.h' '*.cpp' '*.hpp' ':(exclude)build/**' ':(exclude)main/advanced/build/**')
      #     if [ ${#source_files[@]} -eq 0 ]; then
      #       echo 'No source files found to format-check.'
      #       exit 0
      #     fi
      #     clang-format --dry-run --Werror "${source_files[@]}"

      - name: Run static analysis
        id: codechecker
        run: |
          mkdir -p reports
          printf '%s\n' \
            "-$GITHUB_WORKSPACE/build/*" \
            "-$GITHUB_WORKSPACE/build-checks/*" \
            "-$GITHUB_WORKSPACE/main/advanced/build/*" \
            "+$GITHUB_WORKSPACE/main/*" \
            '-*' \
            > reports/codechecker.skip
          mapfile -d '' source_files < <(git ls-files -z '*.c' '*.h' '*.cpp' '*.hpp' ':(exclude)build/**' ':(exclude)main/advanced/build/**')
          if [ ${#source_files[@]} -eq 0 ]; then
            echo 'No source files found for static analysis.'
            printf '%s\n' '{"version": 1, "reports": []}' > reports/codechecker.json
            echo 'exit_code=0' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          . .venv-codechecker/bin/activate
          export CC_ANALYZERS_FROM_PATH=1
          rm -rf reports/codechecker
          set +e
          CodeChecker analyze build-checks/compile_commands.json \
            --output reports/codechecker \
            --analyzers cppcheck \
            --ignore reports/codechecker.skip
          codechecker_exit_code=$?
          set -e
          if [ -d reports/codechecker ]; then
            CodeChecker parse -e json reports/codechecker > reports/codechecker.json
          else
            printf '%s\n' '{"version": 1, "reports": []}' > reports/codechecker.json
          fi
          echo "exit_code=$codechecker_exit_code" >> "$GITHUB_OUTPUT"

      - name: Emit CodeChecker annotations
        if: always()
        run: |
          python3 <<'PY'
          import json
          import os

          report_path = 'reports/codechecker.json'
          if not os.path.exists(report_path):
              raise SystemExit('CodeChecker report not found')

          def escape(value: str) -> str:
              return value.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')

          with open(report_path, encoding='utf-8') as report_file:
              report = json.load(report_file)

          workspace = os.environ.get('GITHUB_WORKSPACE', '')
          for item in report.get('reports', []):
              severity = (item.get('severity') or 'UNSPECIFIED').upper()
              message = item.get('message') or item.get('checker_name') or 'CodeChecker finding'
              rule = item.get('checker_name') or 'CodeChecker'
              file_info = item.get('file') or {}
              file_name = file_info.get('path') or file_info.get('original_path') or ''
              line = item.get('line')
              column = item.get('column')

              if not file_name and file_info.get('original_path'):
                  file_name = file_info['original_path']
              if workspace and file_name.startswith(workspace + '/'):
                  file_name = os.path.relpath(file_name, workspace)

              command = 'notice'
              if severity in {'CRITICAL', 'HIGH'}:
                  command = 'error'
              elif severity in {'MEDIUM', 'LOW'}:
                  command = 'warning'

              params = []
              if file_name:
                  params.append(f'file={file_name}')
              if line:
                  params.append(f'line={line}')
              if column:
                  params.append(f'col={column}')
              if rule:
                  params.append(f'title={escape(rule)}')

              print(f"::{command} {','.join(params)}::{escape(message)}")
          PY

      - name: Evaluate CodeChecker quality gates
        if: always()
        id: codechecker_gates
        env:
          CODECHECKER_MAX_CRITICAL: ${{ env.CODECHECKER_MAX_CRITICAL }}
          CODECHECKER_MAX_HIGH: ${{ env.CODECHECKER_MAX_HIGH }}
          CODECHECKER_MAX_MEDIUM: ${{ env.CODECHECKER_MAX_MEDIUM }}
          CODECHECKER_MAX_LOW: ${{ env.CODECHECKER_MAX_LOW }}
          CODECHECKER_MAX_STYLE: ${{ env.CODECHECKER_MAX_STYLE }}
          CODECHECKER_MAX_UNSPECIFIED: ${{ env.CODECHECKER_MAX_UNSPECIFIED }}
        run: |
          python3 <<'PY'
          import json
          import os

          report_path = 'reports/codechecker.json'
          with open(report_path, encoding='utf-8') as report_file:
              report = json.load(report_file)

          counters = {
              'CRITICAL': 0,
              'HIGH': 0,
              'MEDIUM': 0,
              'LOW': 0,
              'STYLE': 0,
              'UNSPECIFIED': 0,
          }
          for item in report.get('reports', []):
              severity = (item.get('severity') or 'UNSPECIFIED').upper()
              counters[severity] = counters.get(severity, 0) + 1

          thresholds = {
              'CRITICAL': int(os.environ['CODECHECKER_MAX_CRITICAL']),
              'HIGH': int(os.environ['CODECHECKER_MAX_HIGH']),
              'MEDIUM': int(os.environ['CODECHECKER_MAX_MEDIUM']),
              'LOW': int(os.environ['CODECHECKER_MAX_LOW']),
              'STYLE': int(os.environ['CODECHECKER_MAX_STYLE']),
              'UNSPECIFIED': int(os.environ['CODECHECKER_MAX_UNSPECIFIED']),
          }

          failures = []
          for severity, count in counters.items():
              threshold = thresholds[severity]
              if count > threshold:
                  failures.append(f'{severity}: {count} > {threshold}')

          summary_lines = [
              '## CodeChecker Quality Gates',
              '',
              '| Severity | Findings | Threshold |',
              '| --- | ---: | ---: |',
          ]
          for severity in ['CRITICAL', 'HIGH', 'MEDIUM', 'LOW', 'STYLE', 'UNSPECIFIED']:
              summary_lines.append(f'| {severity} | {counters.get(severity, 0)} | {thresholds[severity]} |')

          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write('\n'.join(summary_lines) + '\n')
              if failures:
                  summary.write('\nGate failures:\n')
                  for failure in failures:
                      summary.write(f'- {failure}\n')

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'failed={str(bool(failures)).lower()}\n')
              output.write(f'failure_count={len(failures)}\n')

          if failures:
              for failure in failures:
                  print(f'::error title=CodeChecker quality gate::{failure}')
          else:
              print('CodeChecker quality gates passed.')
          PY

      - name: Upload CodeChecker report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: codechecker-report
          if-no-files-found: error
          path: |
            reports/codechecker/
            reports/codechecker.json
            reports/codechecker.skip

      - name: Fail on CodeChecker execution
        if: steps.codechecker.outputs.exit_code != '0'
        run: |
          echo "CodeChecker execution failed. See the checks job log for details."
          exit 1

      - name: Fail on CodeChecker quality gates
        if: steps.codechecker_gates.outputs.failed == 'true'
        run: |
          echo "CodeChecker quality gates failed. See the workflow summary, annotations, or codechecker-report artifact."
          exit 1

  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Build firmware
        run: |
          . /opt/esp/idf/export.sh
          idf.py -B build-ci set-target esp32
          idf.py -B build-ci build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: esp-test-build
          if-no-files-found: error
          path: |
            build-ci/*.bin
            build-ci/*.elf
            build-ci/*.map
            build-ci/bootloader/*.bin
            build-ci/partition_table/*.bin