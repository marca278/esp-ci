name: ESP-IDF CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

concurrency:
  group: esp-idf-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Allow Git workspace in container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install quality tools
        run: |
          apt-get update
          apt-get install -y clang-format cppcheck

      - name: Check formatting
        run: |
          mapfile -d '' source_files < <(git ls-files -z '*.c' '*.h' '*.cpp' '*.hpp' ':(exclude)build/**' ':(exclude)main/advanced/build/**')
          if [ ${#source_files[@]} -eq 0 ]; then
            echo 'No source files found to format-check.'
            exit 0
          fi
          clang-format --dry-run --Werror "${source_files[@]}"

      - name: Run static analysis
        run: |
          mapfile -d '' source_files < <(git ls-files -z '*.c' '*.h' '*.cpp' '*.hpp' ':(exclude)build/**' ':(exclude)main/advanced/build/**')
          if [ ${#source_files[@]} -eq 0 ]; then
            echo 'No source files found for static analysis.'
            exit 0
          fi
          cppcheck \
            --enable=warning,style,performance,portability \
            --error-exitcode=1 \
            --inline-suppr \
            --quiet \
            "${source_files[@]}"

  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build firmware
        run: |
          . /opt/esp/idf/export.sh
          idf.py -B build-ci set-target esp32
          idf.py -B build-ci build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: esp-test-build
          if-no-files-found: error
          path: |
            build-ci/*.bin
            build-ci/*.elf
            build-ci/*.map
            build-ci/bootloader/*.bin
            build-ci/partition_table/*.bin