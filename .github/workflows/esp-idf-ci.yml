name: ESP-IDF CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CPPCHECK_MAX_ERROR: '0'
  CPPCHECK_MAX_WARNING: '0'
  CPPCHECK_MAX_PORTABILITY: '0'
  CPPCHECK_MAX_PERFORMANCE: '0'
  CPPCHECK_MAX_STYLE: '20'
  CPPCHECK_MAX_INFORMATION: '20'

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

concurrency:
  group: esp-idf-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Allow Git workspace in container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install quality tools
        run: |
          apt-get update
          apt-get install -y clang-format cppcheck

      # - name: Check formatting
      #   run: |
      #     mapfile -d '' source_files < <(git ls-files -z '*.c' '*.h' '*.cpp' '*.hpp' ':(exclude)build/**' ':(exclude)main/advanced/build/**')
      #     if [ ${#source_files[@]} -eq 0 ]; then
      #       echo 'No source files found to format-check.'
      #       exit 0
      #     fi
      #     clang-format --dry-run --Werror "${source_files[@]}"

      - name: Run static analysis
        id: cppcheck
        run: |
          mkdir -p reports
          mapfile -d '' source_files < <(git ls-files -z '*.c' '*.h' '*.cpp' '*.hpp' ':(exclude)build/**' ':(exclude)main/advanced/build/**')
          if [ ${#source_files[@]} -eq 0 ]; then
            echo 'No source files found for static analysis.'
            printf '%s\n' '<?xml version="1.0" encoding="UTF-8"?>' '<results version="2"><cppcheck version="0"/><errors></errors></results>' > reports/cppcheck.xml
            echo 'exit_code=0' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          set +e
          cppcheck \
            --enable=warning,style,performance,portability \
            --inline-suppr \
            --xml \
            --xml-version=2 \
            "${source_files[@]}" \
            2> reports/cppcheck.xml
          cppcheck_exit_code=$?
          set -e
          echo "exit_code=$cppcheck_exit_code" >> "$GITHUB_OUTPUT"

      - name: Emit cppcheck annotations
        if: always()
        run: |
          python3 <<'PY'
          import os
          import xml.etree.ElementTree as ET

          report_path = 'reports/cppcheck.xml'
          if not os.path.exists(report_path):
              raise SystemExit('cppcheck report not found')

          def escape(value: str) -> str:
              return value.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')

          tree = ET.parse(report_path)
          root = tree.getroot()
          for error in root.findall('./errors/error'):
              severity = error.attrib.get('severity', 'warning')
              message = error.attrib.get('msg', error.attrib.get('id', 'cppcheck finding'))
              verbose = error.attrib.get('verbose', '')
              rule = error.attrib.get('id', 'cppcheck')
              location = error.find('location')

              command = 'warning'
              if severity in {'error'}:
                  command = 'error'
              elif severity in {'style', 'performance', 'portability', 'information'}:
                  command = 'notice'

              params = []
              if location is not None:
                  file_name = location.attrib.get('file')
                  line = location.attrib.get('line')
                  column = location.attrib.get('column')
                  if file_name:
                      params.append(f'file={file_name}')
                  if line:
                      params.append(f'line={line}')
                  if column:
                      params.append(f'col={column}')
              if rule:
                  params.append(f'title={escape(rule)}')

              body = message
              if verbose and verbose != message:
                  body = f'{message} ({verbose})'

              print(f"::{command} {','.join(params)}::{escape(body)}")
          PY

      - name: Evaluate cppcheck quality gates
        if: always()
        id: cppcheck_gates
        env:
          CPPCHECK_MAX_ERROR: ${{ env.CPPCHECK_MAX_ERROR }}
          CPPCHECK_MAX_WARNING: ${{ env.CPPCHECK_MAX_WARNING }}
          CPPCHECK_MAX_PORTABILITY: ${{ env.CPPCHECK_MAX_PORTABILITY }}
          CPPCHECK_MAX_PERFORMANCE: ${{ env.CPPCHECK_MAX_PERFORMANCE }}
          CPPCHECK_MAX_STYLE: ${{ env.CPPCHECK_MAX_STYLE }}
          CPPCHECK_MAX_INFORMATION: ${{ env.CPPCHECK_MAX_INFORMATION }}
        run: |
          python3 <<'PY'
          import os
          import xml.etree.ElementTree as ET

          report_path = 'reports/cppcheck.xml'
          tree = ET.parse(report_path)
          root = tree.getroot()

          counters = {
              'error': 0,
              'warning': 0,
              'portability': 0,
              'performance': 0,
              'style': 0,
              'information': 0,
          }
          for error in root.findall('./errors/error'):
              severity = error.attrib.get('severity', 'warning')
              counters[severity] = counters.get(severity, 0) + 1

          thresholds = {
              'error': int(os.environ['CPPCHECK_MAX_ERROR']),
              'warning': int(os.environ['CPPCHECK_MAX_WARNING']),
              'portability': int(os.environ['CPPCHECK_MAX_PORTABILITY']),
              'performance': int(os.environ['CPPCHECK_MAX_PERFORMANCE']),
              'style': int(os.environ['CPPCHECK_MAX_STYLE']),
              'information': int(os.environ['CPPCHECK_MAX_INFORMATION']),
          }

          failures = []
          for severity, count in counters.items():
              threshold = thresholds[severity]
              if count > threshold:
                  failures.append(f'{severity}: {count} > {threshold}')

          summary_lines = [
              '## Cppcheck Quality Gates',
              '',
              '| Severity | Findings | Threshold |',
              '| --- | ---: | ---: |',
          ]
          for severity in ['error', 'warning', 'portability', 'performance', 'style', 'information']:
              summary_lines.append(f'| {severity} | {counters.get(severity, 0)} | {thresholds[severity]} |')

          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write('\n'.join(summary_lines) + '\n')
              if failures:
                  summary.write('\nGate failures:\n')
                  for failure in failures:
                      summary.write(f'- {failure}\n')

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'failed={str(bool(failures)).lower()}\n')
              output.write(f'failure_count={len(failures)}\n')

          if failures:
              for failure in failures:
                  print(f'::error title=cppcheck quality gate::{failure}')
          else:
              print('Cppcheck quality gates passed.')
          PY

      - name: Upload cppcheck report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cppcheck-report
          if-no-files-found: error
          path: reports/cppcheck.xml

      - name: Fail on cppcheck execution
        if: steps.cppcheck.outputs.exit_code != '0'
        run: |
          echo "cppcheck execution failed. See the checks job log for details."
          exit 1

      - name: Fail on cppcheck quality gates
        if: steps.cppcheck_gates.outputs.failed == 'true'
        run: |
          echo "cppcheck quality gates failed. See the workflow summary, annotations, or cppcheck-report artifact."
          exit 1

  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Build firmware
        run: |
          . /opt/esp/idf/export.sh
          idf.py -B build-ci set-target esp32
          idf.py -B build-ci build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: esp-test-build
          if-no-files-found: error
          path: |
            build-ci/*.bin
            build-ci/*.elf
            build-ci/*.map
            build-ci/bootloader/*.bin
            build-ci/partition_table/*.bin